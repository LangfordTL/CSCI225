<html>
    <head>
        <title> CSCI225 Contact Me file</title>
    </head>
        <body>
            <main>
                <section>
                    <h2>Youtube Video</h2>
                    <a href=""> Youtube Video</a>
                </section>
                
                <section>
                    <h2>Feedback Form</h2>
                    <p>
                        <label> First Name<input type="text" name="fname" placeholder="anonymous"></label>
                        <p></p>
                        <label> Last Name<input type="text" name="lname" placeholder="anonymous"></label>
                        <p></p>
                        <label> Email<input type="email" name="mail" placeholder="xxx@domain.com" required></label>
                        <p></p>

                        Would you recommend this webite?
                        <label> Yes <input type="radio" name="y" value="Yes"></label>
                        <label> No <input type="radio" name="n" value="No"></label>

                        What is your favorite website?
                        <select name="favwebsite" size="1" multiple>
                            <option value="g"> Google</option>
                            <option value="d"> Discord</option>
                            <option value="x"> Twitter</option>
                            <option value="y"> YouTube</option>
                            <option value="f"> Facebook</option>
                            <option value="i"> Instagram</option>
                            <option value="t"> TikTok</option>
                        </select>

                        Scale this website from 1-10
                        <input type="range" name="rate" id="rating" step="1" min="1" max="10">
                    </p>

                </section>

            </main>
        </body>
</html>
