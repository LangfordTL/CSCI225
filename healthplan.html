            <div id="BasicCalories">
                <h2> Basic Calories </h2>
                <p> What's your Gender?
                    <select id="gender">
                        <option> Men </option>
                        <option> Women</option>
                    </select>.</p>
                <p>
                    <input type="button" value="Calculate" onclick="genderCalculate();">
                    <label id="genderResults"> </label>
                </p>

                <script>
                    function genderCalculate (){
                        const genderE = document.getElementById('gender');
                        let w = parseFloat(document.getElementById("weight").value);
                        let h = parseFloat(document.getElementById("height").value);
                        let age = parseFloat(document.getElementById("age").value);
                    //const BMIE = document.querySelector('.BMI'); 
                        console.log("The user's gender is " + genderE.value);
                        console.log("The index is " + genderE.selectionIndex);
                        let gender = document.getElementById("gender").value;
                        if (gender === "Men"){
                            BC = (w * 10) + (h * 6.25) - (age * 5) + 5;
                        }
                        else if (gender === "Women"){
                            BC = (w * 10) + (h * 6.25) - (age * 5) - 161;
                        }
                        else{
                            BC = 0;
                        }
                        console.log("The basic calories is " + Math.round(BC));
                        document.getElementById("genderResults").textContent = "Your basic calories based on your gender is " + Math.round(BC);
                    }
                </script>

            <div id="CalorieTarget">
                <h2> Calorie Target</h2>
                <p>Check if you're Obese, Overweight, or Normal/Underweight</p>
                <script>
                    function CTCalculate() {
                        //let BMI = parseFloat(document.getElementById("BMI")).value;
                        //let BC = parseFloat(document.getElementById("BasicCalories")).value;
                        let ct = 0;
                        let weightclass = "";
                        if (BMI >= 30) {
                            ct = BC - 750;
                            weightclass = "Obese";
                        } else if (BMI >= 25.0){
                            ct = BC - 500;
                            weightclass = "Overweight";
                        } else if (BMI < 25.0){
                            ct = BC;
                            weightclass = "Normal/Underweight";
                        }
                        calorieTarget = Math.round(ct);
                        console.log("The Calorie Target is " + calorieTarget);
                        document.getElementById("CTResults").textContent = "Based on your BMI and Basic Calories, your Calorie Target is " + calorieTarget + " calories per day. You are " + weightclass + ".";
                    }
                </script>
                <p>
                    <input type="button" value="Calculate" onclick="CTCalculate();">
                    <label id="CTResults"> </label>
                </p>

                //shuffles up the names and calories count
                function mealPlanGenerate(){
                    let calorieCal = [...foodDatabase];
                    for(let i = calorieCal.length - 1; i > 0; i--){
                        const j = Math.floor(Math.random() * (i+1));
                        let temp = calorieCal[i];
                        calorieCal[i] = calorieCal[j];
                        calorieCal[j] = temp;
                    }

                    let mealPlanFoods = [];
                    let mealPlanCalories = 0;
                    let output = "You can eat "

                    for (let i = 0; i < calorieCal.length; i++){
                        if (mealPlanCalories + calorieCal[i].cal <= calorieTarget){
                            mealPlanFoods.push(calorieCal[i]);
                            mealPlanCalories += calorieCal[i].cal;
                        }
                    }

                    for (let i = 0; i < mealPlanFoods.length; i++){
                        if (i>0){
                            output += ", ";
                        }

                        output += mealPlanFoods[i].name;
                    }

                    output += " with your calorie target of " + mealPlanCalories + " calories, within your daily calories of " + calorieTarget + " calories";

                    document.getElementById("MealPlanResults").textContent = output;
